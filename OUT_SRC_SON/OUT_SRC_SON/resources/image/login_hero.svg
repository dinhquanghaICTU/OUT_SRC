<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <!-- Background Soft Circles & Foliage -->
  <circle cx="200" cy="220" r="160" fill="url(#bgGrad)"/>
  
  <!-- Plant Leaves Behind -->
  <!-- Left branch -->
  <path d="M120 320 Q90 260 80 200 Q95 240 120 280" fill="#a7f3d0"/>
  <ellipse cx="75" cy="190" rx="14" ry="24" transform="rotate(-30 75 190)" fill="#6ee7b7"/>
  <ellipse cx="65" cy="230" rx="12" ry="22" transform="rotate(-50 65 230)" fill="#34d399"/>
  <ellipse cx="95" cy="250" rx="12" ry="22" transform="rotate(20 95 250)" fill="#10b981"/>
  <ellipse cx="60" cy="275" rx="11" ry="20" transform="rotate(-40 60 275)" fill="#6ee7b7"/>
  
  <!-- Right foliage / plant in pot -->
  <ellipse cx="295" cy="300" rx="18" ry="12" fill="#d1fae5"/>
  <path d="M295 330 L285 300 L305 300 Z" fill="#6ee7b7"/>
  <ellipse cx="280" cy="270" rx="12" ry="26" transform="rotate(-25 280 270)" fill="#34d399"/>
  <ellipse cx="310" cy="265" rx="12" ry="26" transform="rotate(25 310 265)" fill="#10b981"/>
  <ellipse cx="295" cy="240" rx="10" ry="28" fill="#6ee7b7"/>
  <ellipse cx="325" cy="290" rx="10" ry="20" transform="rotate(50 325 290)" fill="#34d399"/>
  <ellipse cx="265" cy="295" rx="10" ry="20" transform="rotate(-50 265 295)" fill="#10b981"/>

  <!-- Phone Shadow -->
  <rect x="110" y="325" width="160" height="20" rx="10" fill="#047857" opacity="0.25"/>

  <!-- Smartphone Body -->
  <rect x="115" y="70" width="150" height="260" rx="24" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
  
  <!-- Screen Area -->
  <rect x="123" y="90" width="134" height="220" rx="14" fill="url(#screenGrad)"/>
  
  <!-- Top Bar on Screen -->
  <rect x="123" y="90" width="134" height="18" rx="4" fill="#86efac"/>

  <!-- Top Speaker / Camera Notch -->
  <rect x="165" y="78" width="50" height="4" rx="2" fill="#475569"/>
  <circle cx="155" cy="80" r="2.5" fill="#475569"/>

  <!-- User Avatar Circle -->
  <circle cx="190" cy="155" r="32" fill="url(#avatarGrad)"/>
  <!-- Avatar Head & Shoulders -->
  <circle cx="190" cy="147" r="13" fill="#1e293b"/>
  <path d="M172 178 C172 165 180 162 190 162 C200 162 208 165 208 178 Z" fill="#1e293b"/>

  <!-- Login Input Mockup 1 (Username bar) -->
  <rect x="145" y="200" width="90" height="14" rx="4" fill="#86efac"/>
  
  <!-- Login Input Mockup 2 (Password dots bar) -->
  <rect x="145" y="222" width="90" height="14" rx="4" fill="#a7f3d0"/>
  <!-- Asterisks on password bar -->
  <text x="190" y="233" font-family="monospace" font-size="14" font-weight="900" fill="#0f766e" text-anchor="middle">******</text>

  <!-- Login Button Mockup -->
  <rect x="150" y="250" width="80" height="16" rx="8" fill="#10b981"/>
  <text x="190" y="262" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">LOG IN</text>

  <!-- Phone Bottom Button / Line -->
  <circle cx="190" cy="320" r="6" fill="#475569"/>
  <circle cx="190" cy="320" r="4" fill="#1e293b"/>
</svg>
